<!-- Figma Plugin UI (ui.html) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility Compliance Auditor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="bg-gray-50 font-sans">
  <div class="p-4 max-w-md mx-auto">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold text-gray-900">Accessibility Compliance Auditor</h1>
          <p class="text-xs text-gray-500">WCAG 2.2 compliance checker</p>
        </div>
      </div>

      <div id="selection-state" class="mb-6 p-4 bg-gray-50 rounded-lg">
        <p class="text-sm text-gray-600">Select a Frame, Component, or Instance in Figma</p>
        <div id="selected-info" class="hidden mt-2 text-sm">
          <span class="font-medium text-gray-900" id="selected-name"></span>
          <span class="text-gray-500 ml-2" id="selected-type"></span>
        </div>
      </div>

      <button
        id="analyze-btn"
        class="w-full py-3 px-4 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        disabled
      >
        Analyze Selection
      </button>

      <div id="loading" class="hidden mt-4 text-center">
        <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
        <p class="text-sm text-gray-600">Analyzing with Cloudinary + Snowflake...</p>
        <p class="text-xs text-gray-400 mt-1">This takes 10-30 seconds</p>
      </div>

      <div id="error" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>

      <div id="results" class="hidden mt-6 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="font-semibold text-gray-900">Results</h2>
          <span class="px-2 py-1 text-xs font-medium rounded-full" id="violation-badge"></span>
        </div>

        <div id="violations-list" class="space-y-2 max-h-60 overflow-y-auto"></div>

        <div class="pt-4 border-t border-gray-200">
          <a
            id="dashboard-link"
            href="https://your-app.vercel.app/dashboard"
            target="_blank"
            class="w-full py-2 px-4 bg-gray-100 text-gray-700 font-medium rounded-lg hover:bg-gray-200 text-center block text-sm transition-colors"
          >
            View Full Dashboard →
          </a>
        </div>
      </div>
    </div>

    <div class="mt-4 text-center text-xs text-gray-500">
      Powered by <span class="font-medium">Cloudinary</span> + <span class="font-medium">Snowflake Cortex</span>
    </div>
  </div>

  <script>
    const analyzeBtn = document.getElementById('analyze-btn');
    const selectionState = document.getElementById('selection-state');
    const selectedInfo = document.getElementById('selected-info');
    const selectedName = document.getElementById('selected-name');
    const selectedType = document.getElementById('selected-type');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const results = document.getElementById('results');
    const violationsList = document.getElementById('violations-list');
    const violationBadge = document.getElementById('violation-badge');
    const dashboardLink = document.getElementById('dashboard-link');

    parent.postMessage({ pluginMessage: { type: 'ready' } }, '*');

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      switch (msg.type) {
        case 'selection-changed':
          handleSelectionChange(msg.selection);
          break;
        case 'analysis-started':
          showLoading();
          break;
        case 'analysis-complete':
          showResults(msg.result);
          break;
        case 'analysis-error':
          showError(msg.error);
          break;
      }
    };

    function handleSelectionChange(selection) {
      if (selection.length === 0) {
        analyzeBtn.disabled = true;
        selectedInfo.classList.add('hidden');
        return;
      }

      const node = selection[0];
      const validTypes = ['FRAME', 'COMPONENT', 'INSTANCE'];
      const isValid = validTypes.includes(node.type);

      analyzeBtn.disabled = !isValid;
      selectedInfo.classList.remove('hidden');
      selectedName.textContent = node.name;
      selectedType.textContent = `(${node.type})`;
      selectedType.className = isValid ? 'text-green-600 ml-2' : 'text-red-600 ml-2';
    }

    function showLoading() {
      analyzeBtn.disabled = true;
      analyzeBtn.classList.add('hidden');
      loading.classList.remove('hidden');
      error.classList.add('hidden');
      results.classList.add('hidden');
    }

    function showError(message) {
      loading.classList.add('hidden');
      analyzeBtn.classList.remove('hidden');
      analyzeBtn.disabled = false;
      error.textContent = message;
      error.classList.remove('hidden');
    }

    function showResults(result) {
      loading.classList.add('hidden');
      analyzeBtn.classList.remove('hidden');
      analyzeBtn.disabled = false;
      results.classList.remove('hidden');

      const violations = result.violations || [];
      const counts = { A: 0, AA: 0, AAA: 0 };
      violations.forEach(v => counts[v.severity]++);

      violationBadge.textContent = `${violations.length} violations (A:${counts.A} AA:${counts.AA} AAA:${counts.AAA})`;
      violationBadge.className = `px-2 py-1 text-xs font-medium rounded-full ${
        counts.A > 0 ? 'bg-red-100 text-red-800' :
        counts.AA > 0 ? 'bg-orange-100 text-orange-800' :
        'bg-yellow-100 text-yellow-800'
      }`;

      violationsList.innerHTML = violations.slice(0, 10).map((v, i) => `
        <div class="p-3 bg-gray-50 rounded-lg border border-gray-200">
          <div class="flex items-center gap-2 mb-1">
            <span class="px-1.5 py-0.5 text-xs font-medium rounded border ${
              v.severity === 'A' ? 'bg-red-100 text-red-800 border-red-200' :
              v.severity === 'AA' ? 'bg-orange-100 text-orange-800 border-orange-200' :
              'bg-yellow-100 text-yellow-800 border-yellow-200'
            }">${v.severity}</span>
            <span class="px-1.5 py-0.5 text-xs font-medium bg-blue-100 text-blue-800 border border-blue-200 rounded">WCAG ${v.rule}</span>
          </div>
          <p class="text-xs text-gray-600 font-mono">${v.element_selector}</p>
          ${v.actualRatio ? `<p class="text-xs text-gray-500 mt-1">Contrast: ${v.actualRatio.toFixed(2)}:1 (need ${v.requiredRatio}:1)</p>` : ''}
        </div>
      `).join('') || '<p class="text-sm text-gray-500 text-center py-4">No violations found! 🎉</p>';

      if (result.audit?.cloudinary_public_id) {
        dashboardLink.href = `https://your-app.vercel.app/dashboard?audit=${result.audit.audit_id}`;
      }
    }

    analyzeBtn.addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'analyze-selection' } }, '*');
    });
  </script>
</body>
</html>
